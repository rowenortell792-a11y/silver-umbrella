<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GGC Money Train — Phase 7 | Scene Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff95;
            font-family: 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #050505;
            border-right: 2px solid #00ff95;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 18px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid #00ff95;
            padding-bottom: 15px;
        }
        .pulse-card {
            background: #0a0a0a;
            border: 1px solid #00ff95;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .frequency {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }
        .score {
            font-size: 24px;
        }
        canvas {
            width: 100%;
            height: 80px;
            background: #000;
            margin: 10px 0;
            border: 1px solid #00ff95;
        }
        .scene-card {
            background: #0a0a0a;
            border: 1px solid #00ff95;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .scene-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .scene-beat {
            font-size: 11px;
            color: #00ff9588;
            margin: 5px 0;
            padding: 5px;
            cursor: pointer;
        }
        .scene-beat:hover {
            color: #00ff95;
            background: #00ff9511;
        }
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #00ff95;
            flex-wrap: wrap;
        }
        button {
            background: #00ff9511;
            border: 1px solid #00ff95;
            color: #00ff95;
            padding: 8px 16px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }
        button:hover {
            background: #00ff9533;
        }
        .content-editor {
            flex: 1;
            background: #050505;
            border: 1px solid #00ff95;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status-bar {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #00ff95;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }
        .word-1S { color: #555555; }
        .word-2S { color: #4488aa; }
        .word-3M { color: #00ff95; }
        .word-4M { color: #ffaa44; }
        .word-5M { color: #00ffcc; text-shadow: 0 0 3px #00ffcc; }
        .word-6X { color: #ff44ff; text-shadow: 0 0 5px #ff44ff; }
        .word-7X { color: #ffffff; text-shadow: 0 0 8px #ffffff; animation: pulse-white 0.5s infinite; }
        
        @keyframes pulse-white {
            0% { text-shadow: 0 0 5px #ffffff; }
            100% { text-shadow: 0 0 15px #ffffff; }
        }
